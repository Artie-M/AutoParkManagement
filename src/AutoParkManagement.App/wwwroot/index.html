<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление автопарком</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Система управления автопарком</h1>

    <section class="form-section">
        <h2>Управление водителями</h2>
        <form id="driverForm">
            <input type="hidden" id="driverId">
            <div>
                <label>Имя:</label>
                <input type="text" id="driverName" required>
            </div>
            <div>
                <label>Рейтинг:</label>
                <input type="number" id="driverRating" required>
            </div>
            <div>
                <label>ID Машины:</label>
                <input type="number" id="driverCarId" required>
            </div>
            <button type="submit" id="saveBtn">Добавить водителя</button>
            <button type="button" id="cancelBtn" style="display:none;" onclick="resetForm()">Отмена</button>
        </form>
    </section>

    <section>
        <h2>Список водителей</h2>
        <button onclick="loadDrivers()">Обновить список</button>
        <table id="driversTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Рейтинг</th>
                <th>ID Машины</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
</div>

<script src="app.js"></script>
</body>
</html>
