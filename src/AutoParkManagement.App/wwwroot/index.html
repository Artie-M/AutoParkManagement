<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заказ Авто</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Оформление заказа</h1>
    <section class="form-section">
        <h2>Создать новый заказ</h2>
        <form id="orderForm">
            <div>
                <label>Название маршрута:</label>
                <input type="text" id="routeName" required>
            </div>
            <div>
                <label>Точка отправления:</label>
                <input type="text" id="startPoint" required>
            </div>
            <div>
                <label>Точка прибытия:</label>
                <input type="text" id="finishPoint" required>
            </div>
            <button type="submit" id="submitOrderBtn">Найти водителя и заказать</button>
        </form>
        <p id="orderStatus" style="margin-top: 15px; font-weight: bold;"></p>
    </section>
</div>

<script>
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusEl = document.getElementById('orderStatus');
        statusEl.innerText = "Поиск свободных водителей...";

        try {
            // Запрашиваем всех водителей 
            const driversRes = await fetch('/api/drivers/');
            const drivers = await driversRes.json();

            // Запрашиваем все маршруты для проверки занятости
            const routesRes = await fetch('/api/routes/');
            const routes = await routesRes.json();

            // Логика проверки свободных водителей, которые могут принять заказ 
            const busyDriverIds = routes.filter(r => r.completionTime === null).map(r => r.driver);
            const availableDrivers = drivers.filter(d => !busyDriverIds.includes(d.id));

            if (availableDrivers.length === 0) {
                statusEl.innerText = "Извините, в данный момент нет свободных водителей.";
                return;
            }

            const assignedDriver = availableDrivers[0]; // Назначаем первого свободного

            const newOrder = {
                name: document.getElementById('routeName').value,
                startPoint: document.getElementById('startPoint').value,
                finishPoint: document.getElementById('finishPoint').value,
                driver: assignedDriver.id,
                orderTime: new Date().toISOString()
            };

            const orderRes = await fetch('/api/routes/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newOrder)
            });

            if (orderRes.ok) {
                statusEl.innerText = `Заказ успешно оформлен! Назначен водитель: ${assignedDriver.name}.`;
                document.getElementById('orderForm').reset();
            } else {
                statusEl.innerText = "Произошла ошибка при оформлении заказа.";
            }
        } catch (error) {
            statusEl.innerText = "Ошибка связи с сервером.";
        }
    });
</script>
</body>
</html>
